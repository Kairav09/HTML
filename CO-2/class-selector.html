<html>
  <head>
    <title>Class Selector</title>
    <style>
      .highlight {
        background-color: yellow;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <p class="highlight">This is highlighted text</p>
    <p>This is normal text</p>
  </body>
</html>
