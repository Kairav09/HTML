<html>
  <head>
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="form.css" />
  </head>

  <body>
    <div class="page">
      <form class="form-box">
        <h2>Student Registration Form</h2>

        <label>Student Name</label>
        <input type="text" />

        <div class="row">
          <div class="col">
            <label>Mobile No.</label>
            <input type="text" />
          </div>

          <div class="col">
            <label>Email ID</label>
            <input type="email" />
          </div>
        </div>

        <div class="row">
          <div class="col">
            <label>Father Name</label>
            <input type="text" />
          </div>

          <div class="col">
            <label>Mother Name</label>
            <input type="text" />
          </div>
        </div>

        <div class="row">
          <div class="col">
            <label>Select Course</label>
            <select>
              <option>Select...</option>
              <option>B.Tech</option>
              <option>B.Sc</option>
              <option>BCA</option>
              <option>Other</option>
            </select>
          </div>

          <div class="col">
            <label>Date of Birth</label>
            <input type="date" />
          </div>
        </div>

        <div class="row">
          <div class="col">
            <label>Gender</label>
            <label class="radio-label"> <input type="radio" /> Male </label>
            <label class="radio-label"> <input type="radio" /> Female </label>
          </div>

          <div class="col">
            <label>Student Photo</label>
            <input type="file" />
          </div>
        </div>

        <label>Select Branch</label>
        <select>
          <option>Select...</option>
          <option>CSE</option>
          <option>ECE</option>
          <option>AIDS</option>
          <option>CSIT</option>
        </select>

        <label>Address</label>
        <textarea name="address" rows="4"></textarea>

        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
