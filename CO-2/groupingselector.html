<html>
  <head>
    <title>CSS Grouping Selector</title>
    <style>
      h1,
      h2,
      p {
        text-align: center;
        color: red;
      }
    </style>
  </head>
  <body>
    <h1>This is a heading</h1>
    <h2>This is second heading</h2>
    <p>This is a paragraph</p>
  </body>
</html>
